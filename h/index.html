<style>
  .bin { background: var(--kagit-acik); border-bottom: 1.5px solid var(--murekkep); padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .bin .metin { flex: 1; min-width: 180px; font-size: 13px; }
  .govde { max-width: 1100px; margin: 0 auto; padding: 20px 20px 60px; }
  .iki { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 500px); gap: 32px; align-items: start; }
  .sek { display: none; }
  @media (max-width: 800px) {
    .iki { display: block; }
    .sek { display: flex; gap: 4px; margin: 14px 0 0; }
    .sek button { flex: 1; min-height: 44px; border: 1.5px solid var(--murekkep); background: transparent; font: 700 12px 'Archivo Narrow', sans-serif; letter-spacing: .14em; }
    .sek button.acik { background: var(--murekkep); color: var(--kagit); }
    .iki > section { display: none; } .iki > section.acik { display: block; }
  }
</style>
</head>
<body>
<div class="bin" id="bin" hidden>
  <span class="logo">PERON</span>
  <span class="metin">Bu hattı kendi akademine kopyala.</span>
  <a class="dugme" id="katil" href="#">Hatta bin</a>
</div>
<main class="govde" id="uygulama"><p class="soluk">Yükleniyor…</p></main>
